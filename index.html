<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>📞 প্রিমিয়াম কন্টাক্ট ম্যানেজার | অফলাইন</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ========== RESET & VARIABLES ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', 'Noto Sans Bengali', system-ui, -apple-system, sans-serif; }
    :root {
      --primary: #0b1e3a;
      --primary-light: #1e3a6e;
      --primary-glow: #2a5298;
      --accent: #f59e0b;
      --accent-light: #fbbf24;
      --bg-gradient: linear-gradient(145deg, #f1f5f9 0%, #e8edf5 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --glass-border: rgba(255, 255, 255, 0.8);
      --text-dark: #0f172a;
      --text-muted: #475569;
      --border-light: #e2e8f0;
      --shadow-sm: 0 8px 32px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 20px 60px rgba(0, 0, 0, 0.12);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-dark);
      padding: 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      backdrop-filter: blur(4px);
    }

    .app-container {
      max-width: 1600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ========== COMPACT HEADER WITH SEARCH & CATEGORY ========== */
    .app-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      padding: 16px 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
    }

    .app-header .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .app-header .logo-area i {
      font-size: 1.6rem;
      color: var(--accent-light);
    }

    .app-header .logo-area h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .header-search {
      flex: 1;
      min-width: 180px;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 60px;
      padding: 4px 16px;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      transition: var(--transition);
    }

    .header-search:focus-within {
      border-color: var(--accent-light);
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2);
    }

    .header-search i {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      margin-right: 8px;
    }

    .header-search input {
      width: 100%;
      padding: 8px 0;
      border: none;
      background: transparent;
      font-size: 0.9rem;
      outline: none;
      color: white;
      font-weight: 500;
    }

    .header-search input::placeholder {
      color: rgba(255, 255, 255, 0.55);
      font-weight: 400;
    }

    .header-stats {
      display: flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.12);
      padding: 6px 16px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.8rem;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      white-space: nowrap;
    }

    .header-stats span i {
      margin-right: 4px;
      color: var(--accent-light);
    }

    .header-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-sm {
      padding: 8px 14px;
      border-radius: 40px;
      border: none;
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-sm:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .btn-sm.primary {
      background: var(--accent);
      color: var(--primary);
      border-color: var(--accent);
    }

    .btn-sm.primary:hover {
      background: var(--accent-light);
    }

    /* ========== COMPACT CATEGORY FILTER BAR ========== */
    .category-bar {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      flex-wrap: nowrap;
      scrollbar-width: thin;
      min-height: 44px;
    }

    .category-bar .cat-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .category-chips {
      display: flex;
      gap: 4px;
      flex-wrap: nowrap;
      align-items: center;
    }

    .chip {
      background: rgba(241, 245, 249, 0.8);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-dark);
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
      user-select: none;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .chip:hover { background: #e2e8f0; }

    .chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .chip .count-badge {
      background: rgba(0, 0, 0, 0.08);
      padding: 0px 5px;
      border-radius: 20px;
      font-size: 0.6rem;
      font-weight: 700;
    }

    .chip.active .count-badge {
      background: rgba(255, 255, 255, 0.25);
      color: white;
    }

    /* ========== FILTER TOGGLE ROW (Bengali/English) ========== */
    .filter-toggle-row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 0 4px;
      flex-wrap: wrap;
    }

    .filter-toggle-row .toggle-group {
      display: flex;
      background: var(--card-bg);
      border-radius: 40px;
      padding: 3px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-sm);
    }

    .toggle-btn {
      padding: 5px 14px;
      border-radius: 30px;
      border: none;
      background: transparent;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
    }

    .toggle-btn.active {
      background: var(--primary);
      color: white;
    }

    .toggle-btn:hover:not(.active) {
      background: #f1f5f9;
    }

    /* ========== TABLE ========== */
    .contact-table-wrapper {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--glass-border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 620px;
      overflow-y: auto;
      position: relative;
    }

    .contact-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      table-layout: auto;
      min-width: 750px;
    }

    .contact-table thead {
      position: sticky;
      top: 0;
      background: rgba(241, 245, 249, 0.96);
      backdrop-filter: blur(8px);
      z-index: 5;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .contact-table th {
      text-align: left;
      padding: 12px 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-light);
      white-space: nowrap;
    }

    .contact-table td {
      padding: 10px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: middle;
      color: var(--text-dark);
    }

    .contact-table tbody tr { transition: var(--transition); }
    .contact-table tbody tr:hover { background: rgba(248, 250, 252, 0.9); }

    .contact-name {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      word-break: break-word;
      font-size: 0.88rem;
    }

    .contact-name i { color: var(--primary-glow); font-size: 1rem; opacity: 0.7; }

    .number-cell {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #0f172a;
      word-break: break-word;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .copy-btn-inline {
      background: rgba(241, 245, 249, 0.9);
      border: 1px solid var(--border-light);
      border-radius: 6px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 0.7rem;
      color: var(--text-muted);
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 3px;
      vertical-align: middle;
      white-space: nowrap;
    }

    .copy-btn-inline:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .action-cell {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .icon-btn {
      background: transparent;
      border: none;
      padding: 5px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
    }

    .icon-btn:hover { background: #e2e8f0; color: var(--primary); }
    .icon-btn.call:hover { color: #22c55e; background: #dcfce7; }
    .icon-btn.whatsapp:hover { color: #25D366; background: #dcfce7; }
    .icon-btn.imo:hover { color: #1e88e5; background: #dbeafe; }
    .icon-btn.speak:hover { color: var(--accent); background: #fef3c7; }
    .icon-btn.edit:hover { color: var(--warning); background: #fef3c7; }
    .icon-btn.delete:hover { color: var(--danger); background: #fee2e2; }

    /* ========== EMPTY STATE ========== */
    .empty-state {
      padding: 50px 20px;
      text-align: center;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .empty-state i { font-size: 3rem; opacity: 0.3; }
    .empty-state h3 { font-size: 1.1rem; font-weight: 600; }
    .empty-state p { font-size: 0.85rem; }

    /* ========== MODAL ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal-content {
      background: white;
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.3);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--glass-border);
    }

    .modal-content h2 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 18px;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: var(--text-dark);
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-light);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
      background: #f8fafc;
      font-weight: 500;
    }

    .form-group input:focus {
      border-color: var(--primary-glow);
      background: white;
      box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.08);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 22px;
    }

    /* ========== HISTORY ========== */
    .history-badge {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary);
      color: white;
      padding: 10px 18px;
      border-radius: 60px;
      font-weight: 600;
      box-shadow: 0 12px 32px rgba(11, 30, 58, 0.35);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 900;
      transition: var(--transition);
      border: none;
      font-size: 0.82rem;
    }

    .history-badge:hover { transform: translateY(-2px); background: var(--primary-light); }

    .history-panel {
      position: fixed;
      bottom: 76px;
      right: 20px;
      width: 300px;
      max-width: calc(100vw - 40px);
      background: white;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 950;
      max-height: 360px;
      overflow-y: auto;
      border: 1px solid var(--glass-border);
    }

    .history-panel.active { display: flex; }

    .history-panel h4 {
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--primary);
    }

    .history-list { display: flex; flex-direction: column; gap: 6px; }

    .history-item {
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid var(--primary-glow);
      font-weight: 500;
    }

    .history-item .time { font-size: 0.68rem; color: var(--text-muted); font-weight: 400; }

    /* ========== TOAST ========== */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: #0f172a;
      color: white;
      padding: 12px 24px;
      border-radius: 60px;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      z-index: 2000;
      opacity: 0;
      transition: var(--transition);
      pointer-events: none;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 1000px) {
      .app-header { gap: 10px; padding: 12px 16px; }
      .app-header .logo-area h1 { font-size: 1rem; }
      .header-stats { font-size: 0.72rem; padding: 4px 12px; }
    }

    @media (max-width: 800px) {
      body { padding: 8px; }
      .app-header { flex-wrap: wrap; padding: 10px 14px; }
      .header-search { order: 2; flex: 1 1 100%; }
      .header-actions { order: 3; flex: 1 1 100%; justify-content: stretch; }
      .header-actions .btn-sm { flex: 1; justify-content: center; }
      .header-stats { order: 1; }
      .contact-table { min-width: 650px; font-size: 0.82rem; }
      .contact-table td, .contact-table th { padding: 8px 6px; }
      .action-cell { gap: 1px; }
      .icon-btn { width: 26px; height: 26px; font-size: 0.78rem; padding: 4px; }
      .copy-btn-inline { font-size: 0.65rem; padding: 2px 6px; }
    }

    @media (max-width: 600px) {
      .app-header .logo-area h1 { font-size: 0.9rem; }
      .header-stats span { font-size: 0.68rem; }
      .category-bar { padding: 6px 10px; gap: 6px; }
      .chip { padding: 3px 8px; font-size: 0.68rem; }
      .contact-table { min-width: 100%; display: block; }
      .contact-table thead { display: none; }
      .contact-table tbody tr {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas: "name name" "number number" "actions actions";
        gap: 4px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border-light);
      }
      .contact-table td { padding: 2px 0; border: none; }
      .contact-table td:first-child { grid-area: name; }
      .contact-table td:nth-child(2) { grid-area: number; }
      .contact-table td:nth-child(3) { grid-area: actions; justify-self: end; }
      .contact-name { font-size: 0.9rem; }
      .number-cell { font-size: 0.82rem; }
      .history-badge { bottom: 12px; right: 12px; padding: 8px 14px; font-size: 0.78rem; }
      .history-panel { bottom: 64px; right: 12px; width: calc(100vw - 24px); }
    }

    @media (max-width: 400px) {
      .app-header { padding: 8px 10px; }
      .header-stats { font-size: 0.65rem; padding: 3px 8px; }
      .btn-sm { padding: 6px 10px; font-size: 0.7rem; }
      .contact-table tbody tr { padding: 8px 8px; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- COMPACT HEADER WITH SEARCH -->
  <header class="app-header">
    <div class="logo-area">
      <i class="fas fa-address-book"></i>
      <h1>কন্টাক্ট</h1>
    </div>
    <div class="header-search">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="নাম বা নাম্বার খুঁজুন..." autocomplete="off">
    </div>
    <div class="header-stats">
      <span><i class="fas fa-users"></i> <span id="totalCount">0</span></span>
      <span><i class="fas fa-filter"></i> <span id="filteredCount">0</span></span>
    </div>
    <div class="header-actions">
      <button class="btn-sm" id="clearSearchBtn"><i class="fas fa-times-circle"></i> ক্লিয়ার</button>
      <button class="btn-sm primary" id="addContactBtn"><i class="fas fa-plus-circle"></i> নতুন</button>
      <button class="btn-sm" id="exportBtn"><i class="fas fa-download"></i> এক্সপোর্ট</button>
    </div>
  </header>

  <!-- COMPACT CATEGORY BAR -->
  <div class="category-bar">
    <span class="cat-label"><i class="fas fa-tags"></i></span>
    <div class="category-chips" id="categoryChips"></div>
  </div>

  <!-- FILTER TOGGLE ROW -->
  <div class="filter-toggle-row">
    <div class="toggle-group">
      <button class="toggle-btn active" id="toggleAllBtn">সব</button>
      <button class="toggle-btn" id="toggleBengaliBtn">বাংলা নাম</button>
      <button class="toggle-btn" id="toggleEnglishBtn">English</button>
    </div>
  </div>

  <!-- CONTACT TABLE -->
  <div class="contact-table-wrapper">
    <table class="contact-table" id="contactTable">
      <thead>
        <tr>
          <th>নাম</th>
          <th>নাম্বার</th>
          <th style="text-align:right;">অ্যাকশন</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">
      <i class="fas fa-phone-slash"></i>
      <h3>কোনো কন্টাক্ট পাওয়া যায়নি</h3>
      <p>সার্চ বা কেটাগরি পরিবর্তন করে দেখুন</p>
    </div>
  </div>
</div>

<!-- HISTORY -->
<button class="history-badge" id="historyToggleBtn">
  <i class="fas fa-history"></i> হিস্ট্রি <span id="historyCountBadge" style="background:rgba(255,255,255,0.25); padding:0px 6px; border-radius:20px; font-size:0.7rem;">0</span>
</button>
<div class="history-panel" id="historyPanel">
  <h4><span>🕒 সার্চ হিস্ট্রি</span> <button class="icon-btn" id="clearHistoryBtn" title="ক্লিয়ার"><i class="fas fa-trash-alt" style="font-size:0.8rem;"></i></button></h4>
  <div class="history-list" id="historyList"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <h2 id="modalTitle">নতুন কন্টাক্ট</h2>
    <input type="hidden" id="editIndex" value="-1">
    <div class="form-group">
      <label for="contactName">নাম</label>
      <input type="text" id="contactName" placeholder="যেমন: Ebrahim / খাদিজা" required>
    </div>
    <div class="form-group">
      <label for="contactNumber">নাম্বার</label>
      <input type="text" id="contactNumber" placeholder="যেমন: +8801678600786" required>

  // ========== STATE ==========
  let contacts = [...initialContacts];

  // ========== UTILITIES ==========
  function showToast(msg, isError = false) {
    toastMessage.textContent = msg;
    toast.style.background = isError ? '#ef4444' : '#0f172a';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  function saveToLocal() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(contacts));
      localStorage.setItem(HISTORY_KEY, JSON.stringify(searchHistory));
    } catch (e) {}
  }

  function loadFromLocal() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed) && parsed.length > 0) {
          contacts = parsed;
          filteredContacts = [...contacts];
        }
      }
      const hist = localStorage.getItem(HISTORY_KEY);
      if (hist) {
        searchHistory = JSON.parse(hist);
        if (!Array.isArray(searchHistory)) searchHistory = [];
      }
    } catch (e) {}
  }

  function getFirstChar(name) {
    if (!name) return '#';
    const ch = name.trim().charAt(0);
    if (/[০-৯]/.test(ch)) return ch;
    if (/[0-9]/.test(ch)) return ch;
    return ch.toUpperCase();
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      if (m === '"') return '&quot;';
      return m;
    });
  }

  function isBengaliName(name) {
    return /[\u0980-\u09FF]/.test(name);
  }

  function isEnglishName(name) {
    return /[A-Za-z]/.test(name) && !/[\u0980-\u09FF]/.test(name);
  }

  // ========== CATEGORY CHIPS ==========
  function buildCategoryChips() {
    const charSet = new Set();
    contacts.forEach(c => charSet.add(getFirstChar(c.name)));

    const english = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const bengali = 'অআইঈউঊঋএঐওঔকখগঘঙচছজঝঞটঠডঢণতথদধনপফবভমযরলশষসহড়ঢ়য়ৎংঃঁ'.split('');
    const digits = '0123456789০১২৩৪৫৬৭৮৯'.split('');
    const allChars = new Set([...english, ...bengali, ...digits, ...charSet]);

    const sorted = Array.from(allChars).sort((a, b) => {
      const isEngA = /[A-Z]/.test(a), isEngB = /[A-Z]/.test(b);
      if (isEngA && isEngB) return a.localeCompare(b);
      if (isEngA) return -1;
      if (isEngB) return 1;
      const isBenA = /[অ-হ]/.test(a), isBenB = /[অ-হ]/.test(b);
      if (isBenA && isBenB) return a.localeCompare(b, 'bn');
      if (isBenA) return -1;
      if (isBenB) return 1;
      return a.localeCompare(b);
    });

    let html = `<div class="chip ${activeCategory === 'all' ? 'active' : ''}" data-cat="all">
      <i class="fas fa-list"></i> সব <span class="count-badge">${contacts.length}</span>
    </div>`;

    sorted.forEach(ch => {
      if (ch === '#') return;
      const count = contacts.filter(c => getFirstChar(c.name) === ch).length;
      if (count === 0 && !/[A-Z0-9০-৯]/.test(ch)) return;
      const isActive = activeCategory === ch ? 'active' : '';
      html += `<div class="chip ${isActive}" data-cat="${ch}">
        ${ch} <span class="count-badge">${count}</span>
      </div>`;
    });

    categoryChips.innerHTML = html;
    categoryChips.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        activeCategory = chip.dataset.cat === 'all' ? 'all' : chip.dataset.cat;
        categoryChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        applyFilters();
      });
    });
  }

  // ========== APPLY FILTERS ==========
  function applyFilters() {
    const q = searchQuery.toLowerCase().trim();
    filteredContacts = contacts.filter(c => {
      // category filter
      if (activeCategory !== 'all') {
        const ch = getFirstChar(c.name);
        if (ch !== activeCategory) return false;
      }
      // name script filter
      if (nameScriptFilter === 'bengali') {
        if (!isBengaliName(c.name)) return false;
      } else if (nameScriptFilter === 'english') {
        if (!isEnglishName(c.name)) return false;
      }
      // search filter
      if (q) {
        const nameMatch = c.name.toLowerCase().includes(q);
        const numMatch = c.number.toLowerCase().includes(q);
        if (!nameMatch && !numMatch) return false;
      }
      return true;
    });
    renderTable();
    updateStats();
  }

  // ========== RENDER TABLE ==========
  function renderTable() {
    if (filteredContacts.length === 0) {
      tableBody.innerHTML = '';
      emptyState.style.display = 'flex';
      return;
    }
    emptyState.style.display = 'none';

    let html = '';
    filteredContacts.forEach((c) => {
      const realIndex = contacts.indexOf(c);
      const safeNumber = c.number.replace(/'/g, "\\'");
      const displayNum = escapeHtml(c.number);
      html += `<tr>
        <td>
          <div class="contact-name">
            <i class="fas fa-user-circle"></i>
            ${escapeHtml(c.name)}
          </div>
        </td>
        <td class="number-cell">
          ${displayNum}
          <button class="copy-btn-inline" onclick="copyNumber('${safeNumber}')" title="কপি করুন">
            <i class="fas fa-copy"></i> কপি
          </button>
        </td>
        <td class="action-cell">
          <button class="icon-btn speak" title="শুনুন" onclick="speakNumber('${safeNumber}')"><i class="fas fa-volume-up"></i></button>
          <button class="icon-btn call" title="কল" onclick="callNumber('${safeNumber}')"><i class="fas fa-phone-alt"></i></button>
          <button class="icon-btn whatsapp" title="হোয়াটসঅ্যাপ" onclick="openWhatsApp('${safeNumber}')"><i class="fab fa-whatsapp"></i></button>
          <button class="icon-btn imo" title="ইমো" onclick="openImo('${safeNumber}')"><i class="fas fa-comment-dots"></i></button>
          <button class="icon-btn edit" title="এডিট" onclick="editContact(${realIndex})"><i class="fas fa-edit"></i></button>
          <button class="icon-btn delete" title="ডিলিট" onclick="deleteContact(${realIndex})"><i class="fas fa-trash-alt"></i></button>
        </td>
      </tr>`;
    });
    tableBody.innerHTML = html;
  }

  function updateStats() {
    totalCountSpan.textContent = contacts.length;
    filteredCountSpan.textContent = filteredContacts.length;
  }

  // ========== SEARCH ==========
  function handleSearch() {
    const q = searchInput.value;
    searchQuery = q;
    if (q.trim().length > 0) {
      const last = searchHistory[0];
      if (!last || last.query !== q.trim()) {
        searchHistory.unshift({ query: q.trim(), timestamp: Date.now() });
        if (searchHistory.length > 20) searchHistory.pop();
        updateHistoryUI();
        saveToLocal();
      }
    }
    applyFilters();
  }

  function updateHistoryUI() {
    historyCountBadge.textContent = searchHistory.length;
    if (searchHistory.length === 0) {
      historyList.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:12px; font-size:0.8rem;">কোনো হিস্ট্রি নেই</div>`;
      return;
    }
    let html = '';
    searchHistory.slice(0, 15).forEach(item => {
      const d = new Date(item.timestamp);
      const timeStr = d.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
      html += `<div class="history-item">
        <span>${escapeHtml(item.query)}</span>
        <span class="time">${timeStr}</span>
      </div>`;
    });
    historyList.innerHTML = html;
  }

  // ========== CRUD ==========
  function openAddModal() {
    modalTitle.textContent = 'নতুন কন্টাক্ট';
    editIndexInput.value = '-1';
    contactNameInput.value = '';
    contactNumberInput.value = '';
    modalOverlay.classList.add('active');
    contactNameInput.focus();
  }

  function editContact(index) {
    if (index < 0 || index >= contacts.length) return;
    const c = contacts[index];
    modalTitle.textContent = 'কন্টাক্ট এডিট';
    editIndexInput.value = index;
    contactNameInput.value = c.name;
    contactNumberInput.value = c.number;
    modalOverlay.classList.add('active');
    contactNameInput.focus();
  }

  function deleteContact(index) {
    if (!confirm('আপনি কি এই কন্টাক্টটি ডিলিট করতে চান?')) return;
    contacts.splice(index, 1);
    saveToLocal();
    buildCategoryChips();
    applyFilters();
    showToast('কন্টাক্ট ডিলিট হয়েছে');
  }

  function saveContact() {
    const name = contactNameInput.value.trim();
    const number = contactNumberInput.value.trim();
    if (!name || !number) {
      showToast('নাম এবং নাম্বার উভয়ই দিন', true);
      return;
    }
    const editIdx = parseInt(editIndexInput.value);
    if (editIdx === -1) {
      contacts.push({ name, number });
      showToast('নতুন কন্টাক্ট যোগ হয়েছে');
    } else if (editIdx >= 0 && editIdx < contacts.length) {
      contacts[editIdx] = { name, number };
      showToast('কন্টাক্ট আপডেট হয়েছে');
    }
    saveToLocal();
    buildCategoryChips();
    applyFilters();
    modalOverlay.classList.remove('active');
  }

  // ========== ACTIONS ==========
  window.copyNumber = function(num) {
    navigator.clipboard.writeText(num).then(() => showToast('নাম্বার কপি হয়েছে'))
      .catch(() => showToast('কপি ব্যর্থ', true));
  };

  window.speakNumber = function(num) {
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(num);
      utterance.lang = 'bn-BD';
      speechSynthesis.speak(utterance);
      showToast('শোনানো হচ্ছে...');
    } else {
      showToast('স্পিচ সাপোর্ট নেই', true);
    }
  };

  window.callNumber = function(num) {
    window.location.href = 'tel:' + num;
  };

  window.openWhatsApp = function(num) {
    const clean = num.replace(/\D/g, '');
    window.open('https://wa.me/' + clean, '_blank');
  };

  window.openImo = function(num) {
    const clean = num.replace(/\D/g, '');
    window.open('https://imo.im/' + clean, '_blank');
  };

  // ========== EXPORT ==========
  function exportData() {
    const dataStr = JSON.stringify(contacts, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'contacts_backup_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('এক্সপোর্ট সম্পন্ন');
  }

  // ========== SCRIPT FILTER TOGGLES ==========
  function setScriptFilter(filter) {
    nameScriptFilter = filter;
    toggleAllBtn.classList.toggle('active', filter === 'all');
    toggleBengaliBtn.classList.toggle('active', filter === 'bengali');
    toggleEnglishBtn.classList.toggle('active', filter === 'english');
    applyFilters();
  }

  // ========== INIT ==========
  function init() {
    loadFromLocal();
    buildCategoryChips();
    applyFilters();
    updateHistoryUI();

    searchInput.addEventListener('input', handleSearch);
    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      applyFilters();
    });
    addContactBtn.addEventListener('click', openAddModal);
    exportBtn.addEventListener('click', exportData);
    saveContactBtn.addEventListener('click', saveContact);
    cancelModalBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    });
    historyToggleBtn.addEventListener('click', () => {
      historyPanel.classList.toggle('active');
    });
    clearHistoryBtn.addEventListener('click', () => {
      searchHistory = [];
      updateHistoryUI();
      saveToLocal();
      showToast('হিস্ট্রি ক্লিয়ার হয়েছে');
    });
    document.addEventListener('click', (e) => {
      if (!historyPanel.contains(e.target) && e.target !== historyToggleBtn && !historyToggleBtn.contains(e.target)) {
        historyPanel.classList.remove('active');
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        modalOverlay.classList.remove('active');
        historyPanel.classList.remove('active');
      }
    });

    // Script filter toggles
    toggleAllBtn.addEventListener('click', () => setScriptFilter('all'));
    toggleBengaliBtn.addEventListener('click', () => setScriptFilter('bengali'));
    toggleEnglishBtn.addEventListener('click', () => setScriptFilter('english'));
  }

  window.addEventListener('DOMContentLoaded', init);
